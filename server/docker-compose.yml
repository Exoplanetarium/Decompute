services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: decompute
      POSTGRES_PASSWORD: decompute
      POSTGRES_DB: decompute
    ports:
      - "5432:5432"
    volumes:
      - decompute_pgdata:/var/lib/postgresql/data

volumes:
  decompute_pgdata:
